<ion-content [fullscreen]="true" class="app-content">
  <div class="intro-screen" *ngIf="loading">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <div class="logo-text">T</div>
    </div>

    <h1>tsjovan</h1>
    <p>Loading your experience...</p>

    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
  </div>

  <div class="error-screen" *ngIf="loadError">
    <ion-icon name="warning-outline"></ion-icon>
    <h2>Unable to load the website</h2>
    <p>Please check your internet connection and try again.</p>
    <ion-button (click)="reloadPage()">Try again</ion-button>
  </div>

  <iframe
    *ngIf="websiteUrl"
    id="website-frame"
    class="website-frame"
    [src]="websiteUrl"
    title="Transjovan Cap"
    (load)="onPageLoaded()"
    (error)="onPageError()"
    allow="camera; microphone; geolocation; fullscreen"
  ></iframe>
</ion-content>
